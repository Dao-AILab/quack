name: _test (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the calling event's default).
        type: string
        required: false
        default: ''
      environment:
        description: GitHub environment to run the test job in (e.g. "gpu-ci").
        type: string
        required: false
        default: ''

env:
  # Bump these when pushing a new image; old SIFs are auto-pruned on the next CI run.
  IMAGE_CU129: tridao/quack-kernels:cu12.9-26.09.12
  IMAGE_CU132: tridao/quack-kernels:cu13.2-26.09.12

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install ruff
        # Pin to the same version as .pre-commit-config.yaml — ruff releases
        # change default rule selection and formatter output (0.16.0 went from
        # 59 to 413 default rules), so an unpinned install breaks lint on
        # upstream releases with no repo change.
        run: pip install ruff==0.11.13
      - name: Ruff check
        run: ruff check quack/ tests/
      - name: Ruff format
        run: ruff format --check quack/ tests/

  build:
    name: Wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, architecture: x64, python: '3.13.17'}
          - {os: windows-latest, architecture: x64, python: '3.13.17'}
          - {os: windows-11-arm, architecture: arm64, python: '3.13.17'}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Verify native ARM64 Python
        if: matrix.architecture == 'arm64'
        shell: python
        run: |
          import platform, struct, sys
          assert platform.machine().upper() == 'ARM64', platform.machine()
          with open(sys.executable, 'rb') as image:
              image.seek(60)
              image.seek(struct.unpack('<I', image.read(4))[0])
              assert image.read(4) == b'PE\0\0'
              assert struct.unpack('<H', image.read(2))[0] == 0xAA64
      - name: Install build and test tools
        run: python -m pip install build pytest
      - name: Build regular wheel
        run: python -m build --wheel
      - name: Test packaged source and platform locks
        run: python -m pytest --confcutdir=tests/packaging tests/packaging -q
      - uses: actions/upload-artifact@v4
        with:
          name: quack-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # paths-filter needs git history on push events; for PRs it uses the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'quack/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'

  test:
    needs: changes
    # Forks without matching self-hosted runners can explicitly disable GPU CI.
    if: >
      vars.QUACK_GPU_CI != 'false' &&
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'pull_request_target')
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The cu129 image uses torch cu126 wheels in PyTorch 2.14, which
          # lack Blackwell support. B300 must use the cu132 image.
          - { gpu: h100, cuda: cu129 }
          - { gpu: h100, cuda: cu132 }
          - { gpu: b300, cuda: cu132 }
          - { gpu: h100, cuda: cu129, arch: '120' }
          - { gpu: h100, cuda: cu132, arch: '120' }
    runs-on: [self-hosted, '${{ matrix.gpu }}']
    name: test (${{ matrix.gpu }}${{ matrix.arch && format(' / sm{0}', matrix.arch) || '' }} / ${{ matrix.cuda }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/gpu-test
        with:
          cuda: ${{ matrix.cuda }}
          gpu: ${{ matrix.gpu }}
          image_cu129: ${{ env.IMAGE_CU129 }}
          image_cu132: ${{ env.IMAGE_CU132 }}
          arch: ${{ matrix.arch }}
