name: _test (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the calling event's default).
        type: string
        required: false
        default: ''
      environment:
        description: GitHub environment to run the test job in (e.g. "gpu-ci").
        type: string
        required: false
        default: ''

env:
  # Bump these when pushing a new image; old SIFs are auto-pruned on the next CI run.
  IMAGE_CU129: tridao/quack-kernels:cu12.9-26.09.12
  IMAGE_CU132: tridao/quack-kernels:cu13.2-26.09.12

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install ruff
        # Pin to the same version as .pre-commit-config.yaml — ruff releases
        # change default rule selection and formatter output (0.16.0 went from
        # 59 to 413 default rules), so an unpinned install breaks lint on
        # upstream releases with no repo change.
        run: pip install ruff==0.11.13
      - name: Ruff check
        run: ruff check quack/ tests/
      - name: Ruff format
        run: ruff format --check quack/ tests/

  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # paths-filter needs git history on push events; for PRs it uses the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3
        id: filter
        with:
          filters: |
            code:
              - 'quack/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The cu129 image uses torch cu126 wheels in PyTorch 2.14, which
          # lack Blackwell support. B300 must use the cu132 image.
          - { gpu: h100, cuda: cu129 }
          - { gpu: h100, cuda: cu132 }
          - { gpu: b300, cuda: cu132 }
          - { gpu: h100, cuda: cu129, arch: '120' }
          - { gpu: h100, cuda: cu132, arch: '120' }
    runs-on: [self-hosted, '${{ matrix.gpu }}']
    name: test (${{ matrix.gpu }}${{ matrix.arch && format(' / sm{0}', matrix.arch) || '' }} / ${{ matrix.cuda }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/gpu-test
        with:
          cuda: ${{ matrix.cuda }}
          gpu: ${{ matrix.gpu }}
          image_cu129: ${{ env.IMAGE_CU129 }}
          image_cu132: ${{ env.IMAGE_CU132 }}
          arch: ${{ matrix.arch }}
