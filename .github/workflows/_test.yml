name: _test (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the calling event's default).
        type: string
        required: false
        default: ''
      environment:
        description: GitHub environment to run the test job in (e.g. "gpu-ci").
        type: string
        required: false
        default: ''

env:
  # Bump this when pushing a new image; CI prunes tags unused for a week.
  IMAGE_CU132: tridao/quack-kernels:cu13.2-26.11.22

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install ruff
        # Pin to the same version as .pre-commit-config.yaml and the dev image
        # (RUFF_VERSION in tools/dev/docker/Dockerfile) — ruff releases change
        # formatter output and default rule selection (0.16.0 went from 59 to
        # 413 default rules; pyproject.toml pins `select` for that reason).
        run: pip install ruff==0.17.6
      - name: Ruff check
        run: ruff check quack/ tests/
      - name: Ruff format
        run: ruff format --check quack/ tests/

  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # paths-filter needs git history on push events; for PRs it uses the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'quack/**'
              - 'tests/**'
              - '.github/**'
              - 'pyproject.toml'

  test:
    needs: changes
    if: >
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'pull_request_target')
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Temporarily run only CUDA 13.2 on H100. To restore B300, add:
          # - { gpu: b300, cuda: cu132 }
          - { gpu: h100, cuda: cu132 }
          - { gpu: h100, cuda: cu132, arch: '120' }
    runs-on: [self-hosted, '${{ matrix.gpu }}']
    name: test (${{ matrix.gpu }}${{ matrix.arch && format(' / sm{0}', matrix.arch) || '' }} / ${{ matrix.cuda }})
    # Covers the wait for a Slurm allocation (and a one-off image import) on
    # top of the run itself; the tests have their own 30-minute Slurm limit.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/gpu-test
        with:
          cuda: ${{ matrix.cuda }}
          image: ${{ env.IMAGE_CU132 }}
          arch: ${{ matrix.arch }}
