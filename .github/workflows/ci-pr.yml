name: CI (PR)

# Fork PRs run under pull_request (read-only token, no secrets), never
# pull_request_target: that trigger hands PR code a write token and the base
# repo's secrets and caches. Fork runs wait for workflow approval, and the GPU
# jobs additionally wait for the gpu-ci environment reviewers.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter lists PR files via the API

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_test.yml
    with:
      environment: gpu-ci
